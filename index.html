<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Slide</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts load without blocking first paint (display=swap); the HUD paints in system type first. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@200;300;400;500;600&family=Geist+Mono:wght@400;500&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@200;300;400;500;600&family=Geist+Mono:wght@400;500&display=swap" /></noscript>
    <style>
      /* Skeleton: paints before any JS so the phone never shows a blank or white screen. main.ts replaces it. */
      html, body { margin: 0; height: 100%; background: #07080a; }
      .boot { position: fixed; inset: 0; display: grid; place-items: center; color: #f4f3ef; font: 300 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: .32em; }
      .boot b { display: block; font-weight: 500; font-size: 22px; letter-spacing: .5em; margin-bottom: 10px; text-align: center; }
      .boot span { color: #a9a8ae; font-size: 11px; letter-spacing: .2em; }
    </style>
    <meta name="theme-color" content="#07080a" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Slide" />
    <meta name="description" content="Smoothest driving routes. Posted speeds. Precise timing." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%2307080a'/><path d='M12 40c8-18 32-18 40 0' stroke='%23f0a04b' stroke-width='4' fill='none' stroke-linecap='round'/><circle cx='32' cy='26' r='5' fill='%23f4f3ef'/></svg>" />
  </head>
  <body>
    <div id="app"><div class="boot" aria-hidden="true"><div><b>SLIDE</b><span>LOADING THE MAP…</span></div></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
