<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Slide — preview</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.css" />
  <style>
    :root { --bg:#05070c; --glass:rgba(8,12,20,.72); --line:rgba(170,210,255,.16); --text:#eef6fb; --muted:#8b9eae; --mint:#7cf0d8; --violet:#b388ff; --amber:#ffc857; --glow:#78e0c8; }
    * { box-sizing: border-box; }
    html, body, #map { margin:0; height:100%; background:var(--bg); color:var(--text); font-family:"Segoe UI",sans-serif; overflow:hidden; }
    .hud { position:absolute; inset:0; pointer-events:none; z-index:2; }
    .hud > * { pointer-events:auto; }
    .panel { background:var(--glass); backdrop-filter:blur(18px); border:1px solid var(--line); border-radius:18px; box-shadow:0 18px 50px #0007; }
    .search { position:absolute; top:14px; left:14px; width:min(340px,calc(100vw - 28px)); padding:12px; }
    .brand { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
    .brand h1 { margin:0; letter-spacing:.28em; font-size:14px; }
    .chip { font-size:10px; letter-spacing:.12em; color:var(--mint); border:1px solid #7cf0d855; border-radius:99px; padding:3px 8px; }
    label { display:block; font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin:6px 0 3px; }
    input { width:100%; background:#ffffff08; border:1px solid var(--line); color:var(--text); border-radius:10px; padding:8px 10px; }
    .row { display:flex; gap:8px; margin-top:10px; }
    button { border:0; border-radius:10px; padding:9px 10px; cursor:pointer; }
    .go { flex:1; background:var(--glow); color:#06231c; font-weight:700; }
    .ghost { background:transparent; color:var(--muted); border:1px solid var(--line); }
    .dash { position:absolute; top:14px; right:14px; width:min(260px,calc(100vw - 28px)); padding:10px; display:none; }
    .stats { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
    .stat { border:1px solid var(--line); border-radius:12px; padding:7px 8px; }
    .stat b { display:block; font-size:18px; }
    .stat span { font-size:9px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); }
    .opt { margin-top:6px; width:100%; text-align:left; background:transparent; color:var(--text); border:1px solid var(--line); }
    .opt.on { border-color:var(--glow); background:#78e0c814; }
    .speedo { position:absolute; left:50%; bottom:92px; transform:translateX(-50%); text-align:center; pointer-events:none; }
    .speedo .n { font-size:52px; font-weight:750; line-height:1; text-shadow:0 0 22px #78e0c866; }
    .speedo .u { font-size:11px; letter-spacing:.24em; color:var(--muted); }
    .delta { color:var(--violet); font-size:12px; margin-top:3px; }
    .rail { position:absolute; left:14px; right:14px; bottom:14px; padding:8px 10px; display:none; }
    .bands { display:flex; gap:8px; overflow:auto; }
    .band { min-width:120px; border:1px solid var(--line); border-radius:10px; padding:6px 8px; }
    .band b { color:var(--amber); font-size:16px; }
    .err { color:#ff7a7a; font-size:12px; margin-top:6px; }
    .status { position:absolute; top:14px; left:50%; transform:translateX(-50%); padding:7px 12px; border-radius:99px; display:none; font-size:12px; color:var(--muted); }
    .status.on { display:block; }
    .suggest { position:absolute; left:0; right:0; top:100%; background:#0c131c; border:1px solid var(--line); border-radius:10px; z-index:5; }
    .suggest button { display:block; width:100%; text-align:left; background:none; color:var(--text); padding:8px 10px; }
    .field { position:relative; }
    .car { width:26px; height:40px; filter:drop-shadow(0 8px 8px #0008); }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="hud">
    <div class="panel search">
      <div class="brand"><h1>SLIDE</h1><span class="chip">PREVIEW</span></div>
      <div class="field"><label>From</label><input id="from" placeholder="Wynwood, Miami" /><div class="suggest" id="fs" hidden></div></div>
      <div class="field"><label>To</label><input id="to" placeholder="South Beach, Miami" /><div class="suggest" id="ts" hidden></div></div>
      <div class="row"><button class="go" id="go">Drop the line</button><button class="ghost" id="demo">Demo Miami</button></div>
      <div class="err" id="err"></div>
    </div>
    <div class="panel status" id="status">Scoring the line…</div>
    <div class="panel dash" id="dash">
      <div class="stats">
        <div class="stat"><span>Slide</span><b id="sc">—</b></div>
        <div class="stat"><span>Arrive</span><b id="eta">—</b></div>
        <div class="stat"><span>Ghosts</span><b id="gh">3</b></div>
        <div class="stat"><span>Miles</span><b id="mi">—</b></div>
      </div>
      <div id="opts"></div>
    </div>
    <div class="speedo" id="speedo" hidden><div class="n" id="mph">00</div><div class="u">MPH</div><div class="delta" id="delta">GHOST +0.0s</div></div>
    <div class="panel rail" id="rail"></div>
  </div>
  <script src="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.js"></script>
  <script>
    const VAL = "https://valhalla1.openstreetmap.de";
    const PHOTON = "https://photon.komoot.io/api";
    const map = new maplibregl.Map({
      container: "map",
      style: "https://tiles.openfreemap.org/styles/dark",
      center: [-80.1918, 25.7617],
      zoom: 13.6, pitch: 56, bearing: -16, maxPitch: 75
    });
    let origin=null, dest=null, routes=[], selected=0, coords=[], ghosts=[], t=0, player=null, gMarks=[];
    function decode(str){const out=[];let i=0,lat=0,lon=0;const read=()=>{let r=0,s=0,b;do{b=str.charCodeAt(i++)-63;r|=(b&31)<<s;s+=5;}while(b>=32);return(r&1)?~(r>>1):r>>1;};while(i<str.length){lat+=read();lon+=read();out.push([lon/1e6,lat/1e6]);}return out;}
    async function search(q){const u=new URL(PHOTON);u.searchParams.set("q",q);u.searchParams.set("limit","5");u.searchParams.set("lat","25.76");u.searchParams.set("lon","-80.19");const j=await fetch(u).then(r=>r.json());return(j.features||[]).map(f=>({label:[f.properties.name,f.properties.city||f.properties.county,f.properties.state].filter(Boolean).join(", "),lon:f.geometry.coordinates[0],lat:f.geometry.coordinates[1]}));}
    function bind(input,box,set){let timer;input.addEventListener("input",()=>{clearTimeout(timer);timer=setTimeout(async()=>{if(input.value.length<3){box.hidden=true;return;}try{const hits=await search(input.value);box.innerHTML="";hits.forEach(h=>{const b=document.createElement("button");b.textContent=h.label;b.onclick=()=>{set(h);input.value=h.label;box.hidden=true;};box.appendChild(b);});box.hidden=!hits.length;}catch{box.hidden=true;}},200);});}
    bind(document.getElementById("from"),document.getElementById("fs"),h=>origin=h);
    bind(document.getElementById("to"),document.getElementById("ts"),h=>dest=h);
    document.getElementById("demo").onclick=()=>{origin={lon:-80.199,lat:25.801,label:"Wynwood"};dest={lon:-80.13,lat:25.782,label:"South Beach"};document.getElementById("from").value="Wynwood, Miami";document.getElementById("to").value="South Beach, Miami";plan();};
    document.getElementById("go").onclick=plan;
    function setStatus(s){const el=document.getElementById("status");el.textContent=s;el.classList.toggle("on",!!s);}
    async function plan(){document.getElementById("err").textContent="";if(!origin||!dest){document.getElementById("err").textContent="Set From and To, or tap Demo Miami.";return;}setStatus("Scoring the smoothest 3D line…");try{const body={locations:[{lon:origin.lon,lat:origin.lat},{lon:dest.lon,lat:dest.lat}],costing:"auto",costing_options:{auto:{maneuver_penalty:12,use_tracks:0,use_living_streets:0.1}},alternatives:true,units:"miles"};const res=await fetch(VAL+"/route",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});if(!res.ok)throw new Error("Routing failed "+res.status);const data=await res.json();const trips=[data.trip,...(data.alternatives||[]).map(a=>a.trip)].filter(Boolean);routes=trips.map(trip=>{const shape=trip.legs.map(l=>l.shape).join("");const mi=trip.summary.length;const sec=trip.summary.time;const turns=(trip.legs[0].maneuvers||[]).length;const score=Math.max(1,Math.min(99,Math.round(88-turns*1.6+Math.min(mi,8))));return{trip,shape,mi,sec,turns,score,coords:decode(shape)};});routes.sort((a,b)=>b.score-a.score);selected=0;draw();document.getElementById("dash").style.display="block";document.getElementById("speedo").hidden=false;setStatus("");}catch(e){document.getElementById("err").textContent=e.message;setStatus("");}}
    function draw(){const feats=routes.map((r,i)=>({type:"Feature",properties:{on:i===selected},geometry:{type:"LineString",coordinates:r.coords}}));const fc={type:"FeatureCollection",features:feats};if(map.getSource("routes"))map.getSource("routes").setData(fc);else{map.addSource("routes",{type:"geojson",data:fc});map.addLayer({id:"rg",type:"line",source:"routes",paint:{"line-color":"#7cf0d8","line-width":12,"line-opacity":0.18,"line-blur":6}});map.addLayer({id:"rl",type:"line",source:"routes",paint:{"line-color":["case",["==",["get","on"],true],"#7cf0d8","#4c5d68"],"line-width":["case",["==",["get","on"],true],4.5,2.5],"line-opacity":["case",["==",["get","on"],true],0.95,0.4]}});}const r=routes[selected];document.getElementById("sc").textContent=r.score;document.getElementById("mi").textContent=r.mi.toFixed(1);const arr=new Date(Date.now()+r.sec*1000);document.getElementById("eta").textContent=arr.toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});document.getElementById("mph").textContent=String(Math.round(r.mi/(r.sec/3600))).padStart(2,"0");document.getElementById("opts").innerHTML=routes.map((x,i)=>`<button class="opt${i===selected?" on":""}" data-i="${i}">${i===0?"SLIDE":"ALT"} · ${x.score} · ${Math.round(x.sec/60)} min</button>`).join("");document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{selected=+b.dataset.i;draw();});document.getElementById("rail").style.display="block";document.getElementById("rail").innerHTML=`<div class="bands"><div class="band"><div>Posted</div><b>35</b></div><div class="band"><div>Expect</div><b>${Math.round(r.mi/(r.sec/3600))}</b></div><div class="band"><div>Turns</div><b>${r.turns}</b></div></div>`;coords=r.coords;spawnCars();const b=coords.reduce((bb,c)=>bb.extend(c),new maplibregl.LngLatBounds(coords[0],coords[0]));map.fitBounds(b,{padding:80,duration:800,pitch:56});}
    function carEl(color,tag){const d=document.createElement("div");d.className="car";d.innerHTML=(tag?`<div style="position:absolute;top:-14px;left:50%;transform:translateX(-50%);font-size:9px;color:${color};letter-spacing:.1em">${tag}</div>`:"")+`<svg viewBox="0 0 40 64"><path d="M12 50 L20 8 L28 50 Z" fill="${color}" stroke="#7cf0d8" stroke-width="1.2"/></svg>`;return d;}
    function spawnCars(){player&&player.remove();gMarks.forEach(m=>m.remove());gMarks=[];player=new maplibregl.Marker({element:carEl("#e8eef2"),pitchAlignment:"map",rotationAlignment:"map"}).setLngLat(coords[0]).addTo(map);ghosts=[{tag:"NOVA",color:"#b388ff",o:0.18,s:1.05},{tag:"KITE",color:"#8fd3ff",o:0.42,s:0.92},{tag:"VEX",color:"#ff8a4c",o:0.67,s:1.1}];ghosts.forEach(g=>{const m=new maplibregl.Marker({element:carEl(g.color,g.tag),pitchAlignment:"map",rotationAlignment:"map"}).setLngLat(at(g.o).p).addTo(map);gMarks.push(m);});t=0;}
    function at(u){const idx=Math.max(0,Math.min(1,u))*(coords.length-1);const i=Math.floor(idx),f=idx-i;const a=coords[i],b=coords[Math.min(i+1,coords.length-1)];const br=Math.atan2(b[0]-a[0],b[1]-a[1])*180/Math.PI;return{p:[a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f],br};}
    function tick(){if(coords.length>1){t=(t+0.0016)%1;const you=at(t);player&&player.setLngLat(you.p).setRotation(you.br);ghosts.forEach((g,i)=>{const x=at((g.o+t*g.s)%1);gMarks[i]&&gMarks[i].setLngLat(x.p).setRotation(x.br);});const lead=((ghosts[0].o-t)*(routes[selected]?.sec||0)).toFixed(1);document.getElementById("delta").textContent=`GHOST ${lead>=0?"+":""}${lead}s`;}requestAnimationFrame(tick);}requestAnimationFrame(tick);
    map.on("load",()=>{try{const src=map.getSource("openmaptiles")?"openmaptiles":Object.keys(map.getStyle().sources)[0];map.addLayer({id:"bld",source:src,"source-layer":"building",type:"fill-extrusion",minzoom:13,paint:{"fill-extrusion-color":"#1b2736","fill-extrusion-height":["coalesce",["get","render_height"],["get","height"],16],"fill-extrusion-opacity":0.7}});}catch(e){}});
  </script>
</body>
</html>
